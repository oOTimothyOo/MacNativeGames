name: Native Play and Jamboree

on:
  push:
    paths: ['CMakeLists.txt', 'tools/native-play/**', 'games/jamboree/**', '.github/workflows/native-play.yml']
  pull_request:
    paths: ['CMakeLists.txt', 'tools/native-play/**', 'games/jamboree/**', '.github/workflows/native-play.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cocoa:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, same pin as source CI
        with:
          persist-credentials: false
      - name: Compile the native tools and test programs
        run: |
          cmake -S . -B "$RUNNER_TEMP/native-tools" -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/out/macos-arm64/Release"
          cmake --build "$RUNNER_TEMP/native-tools" --parallel
      - name: Build the content-free native launcher
        run: python3 tools/native-play/build.py --output "$RUNNER_TEMP/Native Play.app" --work-dir "$RUNNER_TEMP/native-play-icon"
      - name: Check recovery, policy and native controls with synthetic state
        run: python3 tools/native-play/test.py --work-dir "$RUNNER_TEMP/native-play-tests" --app "$RUNNER_TEMP/Native Play.app"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, same pin as source CI
        with:
          python-version: '3.14'
      - name: Provision pinned source-test packages in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/jamboree-source-venv"
          "$RUNNER_TEMP/jamboree-source-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: -r games/jamboree/test-requirements.txt
      - name: Check Jamboree packaging and shader-source regressions
        run: '"$RUNNER_TEMP/jamboree-source-venv/bin/python" -m unittest discover -s games/jamboree/tests -v'
